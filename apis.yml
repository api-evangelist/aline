aid: aline
name: Aline
description: >-
  Aline is a legal AI platform that automates contract lifecycle management (CLM)
  for in-house legal, legal operations, procurement, finance, and sales/RevOps
  teams. Its "legal grade AI" drafts and redlines agreements, runs iterative
  "redlines on redlines" negotiation editing, analyzes and reports across large
  contract repositories, and includes AlineSign electronic signatures plus
  agentic AI intake and cross-departmental workflows. Aline syncs documents from
  Google Drive, SharePoint, Dropbox, and Box, and is a Techstars-backed company.
  This profile was enriched from Aline's public product surface; Aline publishes
  no public developer API, so this repo captures its identity, changelog, trust
  center, and domain-security posture rather than API artifacts.
